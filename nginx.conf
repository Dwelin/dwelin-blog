# Dwelin Blog Nginx 配置
# 适用于生产环境部署

server {
    listen 80;
    server_name blog.dwelin.cn;
    
    # 网站根目录 - 指向 dwelin-blog/dist 目录
    root /var/www/html/dwelin/dwelin-blog/dist;
    index index.html;
    
    # 日志配置
    access_log /var/log/nginx/dwelin-blog.access.log;
    error_log /var/log/nginx/dwelin-blog.error.log;
    
    # 主页面配置
    location / {
        try_files $uri $uri/ /index.html;

        # SPA 入口文件建议不缓存，避免浏览器/中间缓存拿到旧的 index.html
        # 导致 CSS/JS 资源版本不一致，从而出现“路由跳转偶发样式缺失/闪现”。
        expires -1;
        add_header Cache-Control "no-cache" always;
        
        # 添加安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    
    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # 启用 gzip 压缩
        gzip_static on;
    }
    
    # API 代理配置
    location /api/ {
        proxy_pass http://dwelin.cn/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # 安全配置
    location ~ /\. {
        deny all;
    }
    
    # 禁止访问敏感文件
    location ~* \.(env|log|sql|bak)$ {
        deny all;
    }
    
    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}
