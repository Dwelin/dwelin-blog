<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwelin Blog - 开发测试</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="app"></div>
    
    <script>
        const { createApp } = Vue;
        const { createRouter, createWebHistory } = VueRouter;
        
        // 简单的测试组件
        const TestComponent = {
            template: `
                <div class="min-h-screen bg-gray-50 p-8">
                    <div class="max-w-4xl mx-auto">
                        <h1 class="text-4xl font-bold text-gray-900 mb-8">
                            Dwelin Blog - 开发测试页面
                        </h1>
                        
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 class="text-2xl font-semibold text-gray-900 mb-4">
                                基本信息
                            </h2>
                            <div class="space-y-2">
                                <p class="text-gray-600">
                                    <strong>当前时间:</strong> {{ currentTime }}
                                </p>
                                <p class="text-gray-600">
                                    <strong>Vue 版本:</strong> {{ vueVersion }}
                                </p>
                                <p class="text-gray-600">
                                    <strong>计数器:</strong> {{ count }}
                                </p>
                            </div>
                            
                            <button 
                                @click="count++"
                                class="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors"
                            >
                                点击计数: {{ count }}
                            </button>
                        </div>
                        
                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <h2 class="text-2xl font-semibold text-gray-900 mb-4">
                                状态检查
                            </h2>
                            <div class="space-y-2">
                                <p class="text-green-600">✅ Vue 3 正常工作</p>
                                <p class="text-green-600">✅ Tailwind CSS 正常工作</p>
                                <p class="text-green-600">✅ 响应式数据正常工作</p>
                                <p class="text-green-600">✅ 事件处理正常工作</p>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            data() {
                return {
                    currentTime: new Date().toLocaleString(),
                    vueVersion: Vue.version,
                    count: 0
                };
            },
            mounted() {
                // 更新当前时间
                setInterval(() => {
                    this.currentTime = new Date().toLocaleString();
                }, 1000);
            }
        };
        
        // 创建路由
        const router = createRouter({
            history: createWebHistory(),
            routes: [
                { path: '/', component: TestComponent }
            ]
        });
        
        // 创建应用
        const app = createApp({
            template: '<router-view />'
        });
        
        app.use(router);
        app.mount('#app');
        
        console.log('Dwelin Blog 测试页面已加载');
    </script>
</body>
</html>
